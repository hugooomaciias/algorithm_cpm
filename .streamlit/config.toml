[theme]
# El color principal para botones primarios, sliders y elementos activos
primaryColor = "#22D3EE"

# El color de fondo principal de la aplicación
backgroundColor = "#0B1220"

# El color de fondo de la barra lateral (sidebar)
secondaryBackgroundColor = "#111827"

# El color del texto
textColor = "#ffffff"

# La tipografía (opciones: "sans serif", "serif", "monospace")
font = "lexend"